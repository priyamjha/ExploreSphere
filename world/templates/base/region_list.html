{% extends 'main.html' %}

{% block content %}

<main class="layout">

    <!-- Page Title -->
    <h2><span class="emoji-placeholder"></span> Explore the Wonders of {{ state.name }}</h2>

    <!-- Regions Grid -->
    <div class="row">
        {% for region in regions %}
        <div class="col-lg-4 col-md-6">
            <div class="region-card">
                <!-- Region Image -->
                {% if region.image %}
                <img src="{{ region.image.url }}" class="region-image" alt="{{ region.name }}">
                {% else %}
                <img src="https://picsum.photos/id/{{ forloop.counter|add:56 }}/350/220" class="region-image" alt="No Image">
                                {% endif %}

                <!-- Region Content -->
                <div class="card-body">
                    <h4 class="card-title"><span class="emoji-placeholder"></span>
                        {{ region.name }}</h4>
                    <h4 class="card-line">( {{ region.head_line }} )<span class="emoji-placeholder"></span>
                    </h4>
                    <a href="{% url 'region_detail' region.id %}" class="btn-primary">Explore</a>
                    <!-- <a href="{% url 'region_detail' region.id %}" class="btn-primary">Explore {{ region.name }}</a> -->
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</main>


<script>
    // List of emojis to choose from
    const emojis = ['🌍', '🌟', '🛕', '🌄', '🌸', '🏔️', '🏞️', '🌿', '🕊️', '🌷', 
                    '🍀', '🍃', '🍁', '🍂', '🌻', '🌺', '🍄', '🌾', '🍊', '🍓', 
                    '🌙', '⭐', '🌈', '🌞', '🌟', '☀️', '🌙', '🌌', '🌏', '🌐',
                    '🌊', '🌬️', '🔥', '🌧️', '❄️', '🌪️', '🌋', '🌳', '🍂', '🌾', 
                    '🍃', '🌻', '🦋', '🐦', '🐝', '🐋', '🐘', '🐾', '🦓', '🦒',];

    // Function to assign emojis randomly
    function assignEmojis() {
        const emojiElements = document.querySelectorAll(".emoji-placeholder");
        emojiElements.forEach((element) => {
            const randomEmoji = emojis[Math.floor(Math.random() * emojis.length)]; // Random emoji
            element.textContent = randomEmoji;
        });
    }

    // Run once when the page loads
    window.onload = assignEmojis;
</script>



<style>
    h2 {
        font-size: 2.5rem;
        font-weight: bold;
        text-align: center;
        margin-bottom: 2.5rem;
        color: #e1f6fb;
    }


    /* Regions Grid Styling */
    .row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        padding-left: 100px;
        /* Add left padding to create gap */
        padding-right: 100px;
        /* Add right padding to create gap */
    }

    .col-lg-4,
    .col-md-6 {
        flex: 1 1 calc(33.333% - 1.5rem);
        /* 3 cards per row on large screens */
        max-width: calc(33.333% - 1.5rem);
        padding-left: 15px;
        /* Add left padding to columns */
        padding-right: 15px;
        /* Add right padding to columns */
    }

    @media screen and (max-width: 768px) {
        .col-lg-4 {
            flex: 1 1 calc(50% - 1.5rem);
            /* 2 cards per row on medium screens */
            max-width: calc(50% - 1.5rem);
        }
    }

    @media screen and (max-width: 480px) {
        .col-lg-4 {
            flex: 1 1 100%;
            /* 1 card per row on small screens */
            max-width: 100%;
        }
    }

    /* Region Card Styling */
    .region-card {
        border: none;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        border-radius: 12px;
        overflow: hidden;
        background-color: var(--color-dark);
        display: flex;
        flex-direction: column;
        margin-bottom: 1.5rem;
        /* Space between each card */
    }

    .region-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
    }

    /* Ensure all images and cards are the same size and fit without cropping */
    .region-image {
        width: 100%;
        height: 220px;
        /* object-fit: contain; */
        /* This ensures the image fits without being cropped */
        background-color: #f8f9fa;
        /* Light grey background for missing images */
        display: block;
    }

    .region-card .card-body {
        text-align: center;
        padding: 1.5rem;
    }

    .card-title {
        font-size: 1.9rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: #ffffff;
    }
    .card-line {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: #ffffff;
    }

    .btn-primary {
        border: none;
        padding: 0.7rem 1.5rem;
        border-radius: 8px;
        transition: background-color 0.3s ease;
        text-decoration: none;
        background-color: #1c88a7;
        color: white;
    }

    .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
    }
</style>

{% endblock %}
